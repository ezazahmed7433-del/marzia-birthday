<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>For Marzia ♡</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#050505;color:#fff;font-family:Georgia,serif}
.screen{display:none;position:absolute;inset:0;overflow:hidden}
.active{display:flex}

.bg{
position:absolute;inset:0;
background:radial-gradient(circle at 50% 30%,#292929,#080808 55%,#000)
}

.stars i{
position:absolute;width:2px;height:2px;background:#fff;
border-radius:50%;opacity:.7
}

.content{
position:relative;z-index:2;width:min(92%,720px);
margin:auto;text-align:center;padding:20px
}

h1{font-size:clamp(30px,8vw,58px);margin:15px 0}

.sub{
font-size:clamp(16px,4.5vw,22px);
line-height:1.65;color:#ddd
}

.btn{
border:1px solid #fff;background:#fff;color:#000;
padding:12px 23px;border-radius:30px;
font-weight:bold;margin-top:15px
}

.btn.dark{background:#111;color:#fff}

.panda{
position:relative;width:190px;height:175px;
margin:0 auto 10px
}

.ear{
position:absolute;top:0;width:55px;height:55px;
background:#050505;border-radius:50%
}

.ear.l{left:18px}
.ear.r{right:18px}

.head{
position:absolute;top:20px;left:25px;
width:140px;height:125px;background:#eee;
border:4px solid #111;border-radius:50%
}

.eye{
position:absolute;top:38px;width:42px;height:52px;
background:#111;border-radius:50%;
transform:rotate(25deg)
}

.eye.l{left:22px}
.eye.r{right:22px;transform:rotate(-25deg)}

.eye:after{
content:"";position:absolute;width:9px;height:9px;
background:#fff;border-radius:50%;top:10px;left:10px
}

.nose{
position:absolute;top:77px;left:61px;
width:18px;height:13px;background:#111;border-radius:50%
}

.mouth{
position:absolute;top:91px;left:56px;
width:28px;height:14px;
border-bottom:3px solid #111;border-radius:50%
}

.body{
position:absolute;top:132px;left:45px;
width:100px;height:43px;background:#111;
border-radius:45px
}

.paw{
position:absolute;top:128px;width:35px;height:52px;
background:#111;border-radius:50%
}

.paw.l{left:17px;transform:rotate(25deg)}
.paw.r{right:17px;transform:rotate(-25deg)}

.story{
background:#000c;border:1px solid #555;
border-radius:22px;padding:22px
}

.storytext{
min-height:145px;display:flex;
align-items:center;justify-content:center;
font-size:clamp(17px,4.5vw,22px);
line-height:1.7
}

.tag{
display:inline-block;border:2px solid #fff;
padding:4px 12px;letter-spacing:3px;margin:0 0 12px
}

.wish{
background:#111e;border:1px solid #666;
border-radius:22px;padding:22px;text-align:left
}

.wish h2,.wish p{text-align:center}

.wish p{
line-height:1.5;color:#ccc
}

textarea{
width:100%;height:250px;
background:#050505;color:#fff;
border:1px solid #666;border-radius:15px;
padding:14px;resize:none
}

.letter{background:#17120e}

.paperwrap{
width:min(94%,780px);height:94vh;
margin:auto;display:flex;
flex-direction:column;position:relative;z-index:2
}

.paper{
margin-top:15px;flex:1;overflow:auto;
background:#e8d6ad;color:#272018;
border:1px solid #8d7149;
padding:28px 22px;
box-shadow:0 15px 45px #000
}

.page{display:none}
.page.on{display:block}

.page h2{text-align:center}

.page p{
font-size:16px;line-height:1.8;
margin:0 0 17px
}

.sign{
text-align:right;
font-style:italic
}

.controls{
text-align:center;
padding:10px
}

.controls button{
border:1px solid #fff;
background:#111;color:#fff;
padding:11px 22px;
border-radius:25px
}
.birthday{
background:radial-gradient(circle at 50% 25%,#333,#090909 60%,#000)
}

.final{
position:relative;z-index:3;width:100%;height:100%;
display:flex;flex-direction:column;
justify-content:center;align-items:center;
text-align:center
}

.photo{
width:min(56vw,250px);
height:min(56vw,250px);
object-fit:cover;
border:5px solid #fff;
border-radius:50%;
box-shadow:0 0 35px #777
}

.age{
font-size:clamp(65px,17vw,110px);
font-weight:bold;
line-height:1
}

.bt{
font-size:clamp(30px,8vw,62px);
font-weight:bold;
margin:15px 0 3px
}

.small{
font-size:clamp(17px,4.5vw,24px)
}

.balloon{
position:absolute;
width:45px;height:60px;
background:#eee;
border-radius:50%;
bottom:12%;
animation:up 3s ease-in-out infinite
}

.b1{left:8%}
.b2{right:8%;bottom:22%;animation-delay:1s}
.b3{left:20%;bottom:35%;width:35px;height:48px;animation-delay:.5s}
.b4{right:20%;bottom:38%;width:35px;height:48px;animation-delay:1.5s}

@keyframes up{
50%{transform:translateY(-18px)}
}

.fallback{font-size:70px}

.conf{
position:absolute;
width:7px;height:13px;
background:#fff;
animation:fall 3s linear forwards
}

@keyframes fall{
to{transform:translateY(110vh) rotate(720deg)}
}

.celebrate{
position:absolute;
right:4%;bottom:0;
transform:scale(.7);
animation:dance .5s infinite alternate
}

@keyframes dance{
to{transform:scale(.74) rotate(5deg)}
}
</style>
</head>

<body>
<section id="intro" class="screen active">

<div class="bg stars"></div>

<div class="content">

<div class="panda">
<i class="ear l"></i>
<i class="ear r"></i>

<div class="head">
<i class="eye l"></i>
<i class="eye r"></i>
<i class="nose"></i>
<i class="mouth"></i>
</div>

<i class="body"></i>
<i class="paw l"></i>
<i class="paw r"></i>
</div>

<h1>Hello, Marzia.</h1>

<p class="sub">
A little panda brought something for you.<br>
Ezaz says it's a birthday gift.
</p>

<button class="btn" onclick="openGift()">
See what it is →
</button>

</div>
</section>


<section id="gift" class="screen">

<div class="bg stars"></div>

<div class="content">

<div style="font-size:100px">🎁</div>

<h1>A gift?</h1>

<p class="sub">
Tap the box. Don't worry, it won't explode.
</p>

<button class="btn" onclick="openStory()">
Open it
</button>

</div>
</section>
