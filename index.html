<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>For Marzia</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: #0b1026;
      color: white;
      font-family: Georgia, serif;
    }

    .stars {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 20%, white 1px, transparent 2px),
        radial-gradient(circle at 70% 30%, white 1px, transparent 2px),
        radial-gradient(circle at 40% 70%, white 1px, transparent 2px),
        radial-gradient(circle at 85% 80%, white 1px, transparent 2px),
        radial-gradient(circle at 10% 90%, white 1px, transparent 2px);
      background-size: 140px 140px;
      opacity: 0.6;
    }

    .screen {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 25px;
    }

    .teddy {
      font-size: 90px;
      margin-bottom: 20px;
      animation: float 3s ease-in-out infinite;
    }

    h1 {
      font-size: 32px;
      margin: 10px 0;
    }

    p {
      font-size: 18px;
      opacity: 0.8;
      margin: 8px 0 25px;
    }

    button {
      border: none;
      padding: 14px 25px;
      border-radius: 30px;
      background: white;
      color: #151936;
      font-size: 16px;
      cursor: pointer;
      transition: 0.25s;
    }

    button:hover {
      transform: scale(1.05);
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-12px);
      }
    }
  </style>
</head>

<body>

  <div class="stars"></div>

  <div class="screen">

    <div class="teddy">🧸</div>

    <h1>Hey, Marzia...</h1>

    <p>Someone left something here for you.</p>

    <button onclick="nextScene()">Let's see →</button>

  </div>

  <script>
    function nextScene() {
      alert("Part 1 works. The next surprise is coming...");
    }
  </script>

</body>
</html>
