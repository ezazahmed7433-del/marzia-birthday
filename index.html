<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Marzia ♡</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  background: #090d20;
  color: #fff;
  font-family: Georgia, "Times New Roman", serif;
}
  /* =========================
   BACKGROUND
========================= */

.stars {
  position: fixed;
  inset: 0;
  z-index: 0;
  background:
    radial-gradient(circle at 10% 20%, #fff 1px, transparent 2px),
    radial-gradient(circle at 30% 80%, #fff 1px, transparent 2px),
    radial-gradient(circle at 50% 35%, #fff 1px, transparent 2px),
    radial-gradient(circle at 75% 15%, #fff 1px, transparent 2px),
    radial-gradient(circle at 90% 70%, #fff 1px, transparent 2px),
    radial-gradient(circle at 60% 90%, #fff 1px, transparent 2px);
  background-size: 150px 150px;
  opacity: .55;
}
  
/* =========================
   GENERAL
========================= */

.scene {
  position: fixed;
  inset: 0;
  z-index: 2;

  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  padding: 25px;
  text-align: center;

  animation: sceneIn .8s ease;
}

.scene.active {
  display: flex;
}

h1 {
  font-size: clamp(30px, 8vw, 48px);
  margin: 10px 0;
}

h2 {
  font-size: clamp(25px, 7vw, 38px);
  margin: 10px 0 20px;
}

p {
  max-width: 650px;
  line-height: 1.7;
  font-size: 17px;
  opacity: .9;
}

button {
  border: none;
  border-radius: 30px;

  padding: 13px 24px;

  background: #fff;
  color: #151936;

  font-family: Georgia, serif;
  font-size: 16px;

  cursor: pointer;

  transition: .25s;
}

button:hover {
  transform: scale(1.06);
}

button:active {
  transform: scale(.96);
}

.small-note {
  font-size: 13px;
  opacity: .55;
  margin-top: 10px;
}
  

/* =========================
   TEDDY
========================= */

.teddy {
  font-size: 90px;
  animation: teddyFloat 3s ease-in-out infinite;
}

@keyframes teddyFloat {

  0%, 100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-14px);
  }
}
  
/* =========================
   SCENE 1
========================= */

#intro {
  background:
    radial-gradient(circle at center, #171d45 0%, #090d20 65%);
}

#intro p {
  margin-bottom: 25px;
  }
  
/* =========================
   GIFT
========================= */

#giftScene {
  background:
    radial-gradient(circle at center, #171d45 0%, #090d20 70%);
}

.gift {
  font-size: 100px;
  cursor: pointer;

  margin: 20px;

  user-select: none;

  animation: giftIdle 2s ease-in-out infinite;
}
  
@keyframes giftIdle {

  0%, 100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-8px);
  }
}

.gift.opening {
  animation: giftOpen .9s ease forwards;
}

@keyframes giftOpen {

  0% {
    transform: scale(1) rotate(0);
    opacity: 1;
  }

  30% {
    transform: scale(1.25) rotate(-8deg);
    opacity: 1;
  }

  60% {
    transform: scale(1.2) rotate(8deg);
    opacity: .75;
  }

  100% {
    transform: scale(1.6);
    opacity: 0;
  }
}

.hidden {
  display: none !important;
}
